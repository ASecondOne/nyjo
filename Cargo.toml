[package]
name = "nyjo"
version = "0.2.0"
edition = "2024"
description = "A Rojo-inspired Roblox Studio local file syncer for Linux (TuxBlox / Vinegar)."
rust-version = "1.88"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json"] }
clap = { version = "4.6.9", features = ["derive"] }
ignore = "0.4.34"
notify = "9"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"
