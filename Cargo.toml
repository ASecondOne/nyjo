[package]
name = "nyjo"
version = "0.1.0"
edition = "2024"
description = "A Rojo-inspired Roblox Studio local file syncer for Linux."
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["json"] }
clap = { version = "4.5.50", features = ["derive"] }
ignore = "0.4.24"
reqwest = { version = "0.12.24", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.23.0"
